name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, check-latest: true, cache: npm }
      - run: node --test scripts/verify-server-runtime.test.mjs
      - run: node --test scripts/release-channel.test.mjs
      - run: node --test scripts/release-artifacts.test.mjs
      - run: python3 -B -m unittest discover -s scripts -p 'verify_candidate_archive_test.py'
      - run: node --test scripts/publish-verified-release.test.mjs
      - run: node scripts/verify-server-runtime.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { LOG_LEVEL: silent }
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  container:
    runs-on: ubuntu-latest
    needs: verify
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          # Only the release workflow may publish a stable/default image.
          push: false
          tags: ghcr.io/giblicious/gib-sync:latest
