services:
  gib-sync:
    build: .
    image: ghcr.io/giblicious/gib-sync:latest
    container_name: gib-sync
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_URL: ${PUBLIC_URL}
      GIBSYNC_SERVER_SECRET: ${GIBSYNC_SERVER_SECRET}
      SEAFILE_URL: ${SEAFILE_URL}
      SEAFILE_PUBLIC_URL: ${SEAFILE_PUBLIC_URL}
      SEAFILE_USERNAME: ${SEAFILE_USERNAME}
      SEAFILE_PASSWORD: ${SEAFILE_PASSWORD}
      SEAFILE_LIBRARY: ${SEAFILE_LIBRARY:-Gib Sync}
      SEAFILE_ALLOWED_HOSTS: ${SEAFILE_ALLOWED_HOSTS}
      GIBSYNC_MIN_CLIENT_VERSION: ${GIBSYNC_MIN_CLIENT_VERSION:-0.8.48}
      GIBSYNC_RECOMMENDED_CLIENT_VERSION: ${GIBSYNC_RECOMMENDED_CLIENT_VERSION:-0.8.50}
      DATA_DIR: /data
      TZ: ${TZ:-UTC}
    volumes:
      - ${GIBSYNC_DATA_PATH:-./data}:/data
    ports:
      - "8787:8787"
    networks:
      - default
      - seafile-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  seafile-net:
    external: true
